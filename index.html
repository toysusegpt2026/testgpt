<!doctype html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>StockLab</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-950 text-slate-100"><div class="mx-auto max-w-6xl p-6"><h1 class="text-3xl font-bold">StockLab 股票分析 App</h1><p class="mt-2 text-slate-400">單一 index.html · HTML + Tailwind</p><div id="app" class="mt-8"></div></div><script>
const stocks=[['騰訊','0700',714.8,714.8],['阿里巴巴','9988',309.4,309.4],['小米','1810',61.46,61.46],['京東','9618',422.8,422.8],['美團','3690',73.3,460],['Tesla','TSLA',320.5,488.54]];
const f=(n)=>Number(n).toLocaleString('zh-Hant-HK',{minimumFractionDigits:2,maximumFractionDigits:2});
function render(){app.innerHTML='<div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">'+stocks.map(s=>{let d=s[2]/s[3]*10;return `<div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><div class="flex justify-between"><div><h2 class="text-xl font-bold">${s[0]}</h2><p class="text-sm text-slate-500">${s[1]}</p></div><span class="rounded-lg bg-indigo-500/10 px-2 py-1 text-indigo-400">${f(d)} 折</span></div><div class="mt-6 text-3xl font-bold">HK$ ${f(s[2])}</div><div class="mt-3 h-2 rounded-full bg-slate-800"><div class="h-2 rounded-full bg-indigo-500" style="width:${Math.min(d*10,100)}%"></div></div><div class="mt-4 flex justify-between text-sm text-slate-400"><span>歷史高位</span><b>HK$ ${f(s[3])}</b></div><div class="mt-2 flex justify-between text-sm text-slate-400"><span>距高位</span><b>${f(100-d*10)}%</b></div></div>`}).join('')+'</div><div class="mt-6 rounded-2xl border border-slate-800 bg-slate-900 p-5"><h2 class="font-bold">分析提示</h2><p class="mt-2 text-sm text-slate-400">折讓只代表現價相對歷史高位的位置，不等同於股票被低估。此版本使用示範資料。</p></div>'}render();
</script></body></html>
